[platformio]
default_envs = sz1, sz2, sz3

[env]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_protocol = espota
lib_extra_dirs = ../LT_Base/lib

[env:sz1]
upload_port = 192.168.0.11
build_flags = -DSECTOR_STATION -DSTATION_ID=1

[env:sz2]
upload_port = 192.168.0.12
build_flags = -DSECTOR_STATION -DSTATION_ID=2

[env:sz3]
upload_port = 192.168.0.13
build_flags = -DSECTOR_STATION -DSTATION_ID=3
