[platformio]
default_envs = basisstation, basisstation_s3
data_dir = data

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

[env:basisstation]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
board_build.lwip2 = PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
upload_protocol = espota
upload_port = 192.168.0.8
build_flags =
    -Wl,--wrap=optimistic_yield
    -I src/common
    -I src
    -I src/platform/esp8266
build_src_filter =
    +<common/*.cpp>
    +<platform/esp8266/*.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESP Async WebServer @ ^3.0.6
    esp32async/ESPAsyncTCP @ ^2.0.0

[env:basisstation_s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=4
    -I src/common
    -I src
    -I src/platform/esp32
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions_s3_16MB.csv
upload_protocol = espota
upload_port = 192.168.0.14
build_src_filter =
    +<common/*.cpp>
    +<platform/esp32/*.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESP Async WebServer @ ^3.0.6
    mathieucarbou/AsyncTCP @ ^3.2.14
lib_ignore =
    WebServer
