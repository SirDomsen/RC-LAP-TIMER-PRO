<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Lap Timer Pro - Web Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-green: #00ff66;
      --neon-cyan: #00e5ff;
      --neon-orange: #ff9900;
      --neon-red: #ff3366;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: 16px;
      padding: 15px;
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(27deg, #151515 5px, transparent 5px),
        linear-gradient(207deg, #151515 5px, transparent 5px),
        linear-gradient(27deg, #222 5px, transparent 5px),
        linear-gradient(207deg, #222 5px, transparent 5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px, 0 10px, 10px 0;
      color: var(--text-main);
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-header {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: 0 auto 15px auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--card-border);
      background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.4)), 
                  url('https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      padding: 25px 15px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 12px var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 24px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .card h2 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--neon-cyan);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .info {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .upload-options {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .upload-box {
      flex: 1;
      padding: 15px;
      background: #0d1117;
      border: 2px dashed var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .upload-box:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .upload-box label {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--neon-cyan);
      cursor: pointer;
      display: block;
      margin-bottom: 5px;
    }

    .upload-box span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    .file-list {
      max-height: 180px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      margin-bottom: 18px;
      padding: 8px;
      text-align: left;
      display: none;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-name {
      color: var(--text-main);
      word-break: break-all;
    }

    .file-status {
      font-family: var(--font-display);
      font-size: 0.8rem;
      white-space: nowrap;
      margin-left: 10px;
    }

    .status-pending { color: var(--text-muted); }
    .status-uploading { color: var(--neon-orange); }
    .status-success { color: var(--neon-green); }
    .status-error { color: var(--neon-red); }

    .btn {
      width: 100%;
      font-family: var(--font-display);
      background: linear-gradient(135deg, #1f293d, #111827);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 12px var(--neon-cyan);
      background: var(--neon-cyan);
      color: #000;
    }

    .btn:disabled {
      border-color: #444;
      color: #666;
      cursor: not-allowed;
      background: #111;
    }

    .progress-container {
      margin-top: 20px;
      display: none;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: #0d1117;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
      transition: width 0.2s ease;
    }

    #overallStatus {
      margin-top: 10px;
      font-family: var(--font-display);
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .nav-back {
      margin-top: 15px;
      display: inline-block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-back:hover {
      color: var(--neon-cyan);
    }
  </style>
</head>
<body>

  <div class="hero-header">
    <h1>🏁 RC LAP TIMER PRO 🏁</h1>
  </div>

  <main class="card">
    <h2>WEB-UPDATE</h2>
    <p class="info">Wähle mehrere Dateien (z.B. <code>index.html</code>, <code>style.css</code>, <code>main.js</code> usw.) aus, um sie nacheinander ins LittleFS hochzuladen.</p>

    <form id="uploadForm">
      <div class="upload-options">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
          <label>📄 DATEIEN AUSWÄHLEN</label>
          <span>Mehrere Web-Dateien markieren</span>
        </div>
      </div>

      <input type="file" id="fileInput" multiple>

      <div class="file-list" id="fileList"></div>

      <button type="submit" id="subBtn" class="btn" disabled>Dateien Hochladen</button>
    </form>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div id="overallStatus">Upload bereit...</div>
    </div>
  </main>

  <a href="/" class="nav-back">← Zurück zur Hauptseite</a>

  <script>
    let selectedFiles = [];

    document.getElementById('fileInput').addEventListener('change', function(e) {
      selectedFiles = Array.from(e.target.files);
      const fileListDiv = document.getElementById('fileList');
      const subBtn = document.getElementById('subBtn');

      if (selectedFiles.length > 0) {
        fileListDiv.style.display = 'block';
        subBtn.disabled = false;
        
        let html = '';
        selectedFiles.forEach((file, index) => {
          html += `<div class="file-item">
            <span class="file-name">${file.name}</span>
            <span class="file-status status-pending" id="status_${index}">Wartet</span>
          </div>`;
        });
        fileListDiv.innerHTML = html;
      } else {
        fileListDiv.style.display = 'none';
        subBtn.disabled = true;
      }
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (selectedFiles.length === 0) return;

      const btn = document.getElementById('subBtn');
      const progressContainer = document.getElementById('progressContainer');
      const progressFill = document.getElementById('progressFill');
      const statusText = document.getElementById('overallStatus');

      btn.disabled = true;
      progressContainer.style.display = 'block';

      let successCount = 0;

      for (let i = 0; i < selectedFiles.length; i++) {
        let file = selectedFiles[i];
        let statusSpan = document.getElementById(`status_${i}`);
        
        statusSpan.className = 'file-status status-uploading';
        statusSpan.innerText = 'Lädt...';
        statusText.innerText = `Lade ${file.name} (${i + 1}/${selectedFiles.length})...`;

        let formData = new FormData();
        formData.append('data', file);

        try {
          let response = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });

          if (response.ok) {
            statusSpan.className = 'file-status status-success';
            statusSpan.innerText = '✓ Fertig';
            successCount++;
          } else {
            statusSpan.className = 'file-status status-error';
            statusSpan.innerText = '✕ Fehler';
          }
        } catch (err) {
          statusSpan.className = 'file-status status-error';
          statusSpan.innerText = '✕ Netzzugang';
        }

        let totalPercent = Math.round(((i + 1) / selectedFiles.length) * 100);
        progressFill.style.width = totalPercent + '%';
      }

      if (successCount === selectedFiles.length) {
        statusText.style.color = 'var(--neon-green)';
        statusText.innerText = '✓ ALLE DATEIEN ERFOLGREICH HOCHGELADEN!';
      } else {
        statusText.style.color = 'var(--neon-orange)';
        statusText.innerText = `⚠ ${successCount} von ${selectedFiles.length} Dateien hochgeladen.`;
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
