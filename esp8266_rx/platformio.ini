; --- Basisstation (NodeMCU) ---
[env:basisstation]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.lwip2 = PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

upload_protocol = espota
upload_port = laptimer.local
build_src_filter = +<../src/*>

monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESP Async WebServer @ ^3.0.6
    esp32async/ESPAsyncTCP @ ^2.0.0


; --- Sektorstation 1 (ESP-01S) ---
[env:sz1]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_protocol = espota
upload_port = SZ-1.local
build_src_filter = +<../src_sz/*> +<../src/ir_decoder.cpp>
build_flags = -DSECTOR_STATION -DSTATION_ID=1

; --- Sektorstation 2 (ESP-01S) ---
[env:sz2]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_protocol = espota
upload_port = SZ-2.local
build_src_filter = +<../src_sz/*> +<../src/ir_decoder.cpp>
build_flags = -DSECTOR_STATION -DSTATION_ID=2

; --- Sektorstation 3 (ESP-01S) ---
[env:sz3]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
;upload_protocol = espota
;upload_port = SZ-3.local
build_src_filter = +<../src_sz/*> +<../src/ir_decoder.cpp>
build_flags = -DSECTOR_STATION -DSTATION_ID=3